# Проверка за доставки, чакащи куриер (lib/dlv-watch.js) — на 10 мин, Пн–Сб, 06:00–17:59 UTC (= 08–20 ч в София).
# Отделен файл, защото workflow „cron“ е изключен ръчно (стари задачи за ориз/напомняне) — не го включваме.
# Vercel Hobby пуска cron само с точност до час, затова минава през GitHub Actions.
name: dlvwatch
on:
  schedule:
    - cron: '*/10 6-17 * * 1-6'
  workflow_dispatch:
jobs:
  dlvwatch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --retry 2 --retry-delay 10 -X GET \
            "https://motamo-api.vercel.app/api/transfer?cron=dlvwatch" \
            -H "User-Agent: vercel-cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
