# Задачи на собственика, които работят в облака (не зависят от компютъра): точка (оборот, наблюдател, сутрин), цех (суровини 7:30, вечер 20:30, нулиране 22:00), сайт (7:50).
# GitHub пуска планираното със закъснение и понякога го пропуска — затова на 10 мин, а tasks/gate.py пази всеки слот да мине веднъж (час по София).
name: tasks
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Суха проба на Цех и Сайт (печата, не праща, не пише в Barsy)'
        default: 'false'
concurrency:
  group: tasks
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PEEK_TOKEN: ${{ secrets.PEEK_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      CEX_TOOL_TOKEN: ${{ secrets.CEX_TOOL_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Наблюдател на поръчките (09:00–21:30)
        continue-on-error: true
        run: python3 tasks/watch.py
      - name: Оборот на точката (Пн–Пт 14:30, 17:30, 19:30)
        continue-on-error: true
        run: if python3 tasks/gate.py turnover 1-5 14:30 17:30 19:30; then python3 tasks/turnover.py; fi
      - name: Сутрешно съобщение за точката (Пн–Пт 8:40)
        continue-on-error: true
        run: if python3 tasks/gate.py sutrin 1-5 08:40; then python3 tasks/sutrin.py; fi
      - name: Цех · суровини за деня (всеки ден 7:30)
        continue-on-error: true
        run: if python3 tasks/gate.py ceh-stock '*' 07:30; then python3 tasks/ceh_jobs.py stock; fi
      - name: Сайт · проверка (всеки ден 7:50)
        continue-on-error: true
        run: if python3 tasks/gate.py sait '*' 07:50; then python3 tasks/sait.py; fi
      - name: Цех · вечерна проверка (20:30)
        continue-on-error: true
        run: if python3 tasks/gate.py ceh-vecher '*' 20:30; then python3 tasks/ceh_jobs.py evening; fi
      - name: Цех · вечерно нулиране (22:00)
        continue-on-error: true
        run: if python3 tasks/gate.py ceh-nulirane '*' 22:00; then python3 tasks/ceh_jobs.py night; fi
      - name: Финанси · седмична сверка (Пн 9:45)
        continue-on-error: true
        run: if python3 tasks/gate.py finansi-sedmica 1 09:45; then python3 tasks/run_notify.py finansi finansi.py; fi
      - name: Финанси · срок на фактурите (15-о и последния ден, 9:45)
        continue-on-error: true
        run: |
          d=$(TZ=Europe/Sofia date +%d); t=$(TZ=Europe/Sofia date -d tomorrow +%d)
          if { [ "$d" = 15 ] || [ "$t" = 01 ]; } && python3 tasks/gate.py finansi-srok '*' 09:45; then python3 tasks/run_notify.py finansi-srok finansi.py; fi
      - name: Точка · седмичен преглед (Пн 8:15)
        continue-on-error: true
        run: if python3 tasks/gate.py tochka-sedmica 1 08:15; then python3 tasks/run_notify.py tochka-sedmica week.py; fi
      - name: Точка · месечен отчет за часовете (последния ден, 21:00)
        continue-on-error: true
        run: if python3 tasks/gate.py chasove '*' 21:00; then python3 tasks/run_notify.py chasove hours.py; fi
      - name: Суха проба (само при ръчно пускане с dry=true)
        if: github.event_name == 'workflow_dispatch' && inputs.dry == 'true'
        run: |
          python3 tasks/sait.py --dry
          python3 tasks/ceh_jobs.py stock --dry | sed 's/k=.*/k=***/'
          python3 tasks/ceh_jobs.py evening --dry
          python3 tasks/ceh_jobs.py night --dry
      - name: Пулс (облачните задачи са живи)
        if: always()
        run: python3 -c "import sys; sys.path.insert(0, 'tasks'); import lib; lib.heartbeat('cloud')"
          cd tasks && python3 llm.py ping
